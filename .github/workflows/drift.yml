name: drift-detection

# Weekly check that real infrastructure still matches the code.
# Exit code 2 from `plan -detailed-exitcode` means something changed outside Terraform.

on:
  schedule:
    - cron: "23 11 * * 1"   # Mondays
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  drift:
    if: vars.AWS_ROLE_ARN_DEV != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.env == 'prod' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks-platform/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
      - id: plan
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -no-color > plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: `Drift detected in ${{ matrix.env }}`,
              body: 'Weekly drift check found changes made outside Terraform. See the workflow run for the plan.',
              labels: ['drift']
            });
      - if: steps.plan.outputs.exitcode == '1'
        run: exit 1
