name: terraform-deploy

# Plan on pull requests, apply only from main through a protected environment.
# Uses GitHub OIDC -> AWS IAM role; no static AWS keys are stored anywhere.
# Needs repository variables AWS_ROLE_ARN_DEV / AWS_ROLE_ARN_PROD and TF_STATE_BUCKET.
# Until those exist the jobs are skipped, so the repo stays green.

on:
  pull_request:
    paths: ["envs/**", "modules/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]
        required: true

permissions:
  contents: read
  id-token: write       # required for OIDC
  pull-requests: write  # to post the plan as a PR comment

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN_DEV != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.env == 'prod' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks-platform/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/${{ matrix.env }}/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan: \`${{ matrix.env }}\`\n\`\`\`\n${plan}\n\`\`\``
            });

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN_DEV != ''
    runs-on: ubuntu-latest
    # prod environment has required reviewers configured in repo settings
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && vars.AWS_ROLE_ARN_PROD || vars.AWS_ROLE_ARN_DEV }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=eks-platform/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="use_lockfile=true"
      - name: Plan
        run: terraform plan -input=false -out=tfplan
      - name: Apply the reviewed plan
        run: terraform apply -input=false tfplan
